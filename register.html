{% extends "base.html" %}{% block content %}<div class="formbox"><h2>User Registration</h2>
<form method="post"><input name="name" placeholder="Full name" required><input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required><input name="phone" placeholder="Phone">
<input name="vehicle_number" placeholder="Vehicle number" required><select name="vehicle_type"><option value="TWO_WHEELER">Two Wheeler</option><option value="FOUR_WHEELER">Four Wheeler</option></select>
<button>Register</button></form></div>{% endblock %}
